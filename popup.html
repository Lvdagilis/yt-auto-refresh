<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --red: #ff0028; --bg: #0f0f0f; --panel: #1c1c1c; --text: #f1f1f1; --muted: #9aa0a6; }
  * { box-sizing: border-box; }
  body { width: 280px; margin: 0; padding: 16px; background: var(--bg); color: var(--text);
         font: 13px/1.5 Roboto, Arial, sans-serif; }
  h1 { font-size: 14px; margin: 0 0 2px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 18px; height: 18px; border-radius: 4px; }
  .sub { color: var(--muted); font-size: 11px; margin: 0 0 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px;
         padding: 9px 0; border-top: 1px solid #2a2a2a; }
  .row:first-of-type { border-top: none; }
  label { color: var(--text); }
  .hint { color: var(--muted); font-size: 11px; }
  input[type="number"] { width: 64px; background: var(--panel); color: var(--text);
         border: 1px solid #333; border-radius: 6px; padding: 5px 7px; font: inherit; text-align: right; }
  .switch { position: relative; width: 38px; height: 22px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #3a3a3a; border-radius: 999px; transition: .15s; }
  .slider::before { content: ""; position: absolute; height: 16px; width: 16px; left: 3px; top: 3px;
         background: #fff; border-radius: 50%; transition: .15s; }
  input:checked + .slider { background: var(--red); }
  input:checked + .slider::before { transform: translateX(16px); }
  .foot { color: var(--muted); font-size: 11px; margin-top: 12px; border-top: 1px solid #2a2a2a; padding-top: 10px; }
</style>
</head>
<body>
  <h1><img src="icon48.png" alt="">YouTube Auto-Refresh</h1>
  <p class="sub">Fixes blinking / 0:00 players on Brave.</p>

  <div class="row">
    <label for="enabled">Enabled</label>
    <span class="switch"><input type="checkbox" id="enabled"><span class="slider"></span></span>
  </div>

  <div class="row">
    <span><label for="graceMs">Wait before refresh</label><div class="hint">raise this on slow connections</div></span>
    <span><input type="number" id="graceMs" min="1000" max="20000" step="500"> ms</span>
  </div>

  <div class="row">
    <label for="maxRetries">Max refreshes / video</label>
    <input type="number" id="maxRetries" min="1" max="10" step="1">
  </div>

  <div class="row">
    <label for="showToast">Show on-page notice</label>
    <span class="switch"><input type="checkbox" id="showToast"><span class="slider"></span></span>
  </div>

  <p class="foot">Counts reset once a video loads correctly. Changes apply on the next video.</p>
  <script src="popup.js"></script>
</body>
</html>
